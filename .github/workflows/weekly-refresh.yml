name: Weekly research refresh

on:
  schedule:
    # Every Monday at 12:00 UTC (~5am Pacific / 8am Eastern)
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run weekly refresh pipeline
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REO_API_KEY: ${{ secrets.REO_API_KEY }}
          REO_SEGMENT_ID: ${{ secrets.REO_SEGMENT_ID }}
        run: npm run refresh

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/reo_activity.json data/outreach_plan.json
          git diff --cached --quiet || git commit -m "Weekly research refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Stage static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp assets/*.css assets/*.js _site/assets/
          cp data/*.json _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
