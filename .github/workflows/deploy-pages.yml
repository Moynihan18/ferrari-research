name: Deploy dashboard on push

# The weekly-refresh workflow only deploys when it runs (Monday cron or manual
# dispatch) - pushing commits directly (UI/data/script changes) never
# redeployed GitHub Pages otherwise. This workflow closes that gap: it
# publishes whatever is already committed, with no Cursor CLI / API calls and
# no cost, so every push to this branch goes live within a couple minutes.

on:
  push:
    branches:
      - claude/research-dashboard-sales-7hsy9t

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Stage static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp assets/*.css assets/*.js _site/assets/
          cp data/*.json _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
